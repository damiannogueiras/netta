site_name: Netta Rufina | La obra
site_description: Guion, recursos e investigación de la obra de Netta Rufina.
theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: teal
      accent: amber
  font:
    text: Lora
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - toc.follow

docs_dir: docs
site_dir: site

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true